name: docs

on:
  push:
    branches: [main]
    paths:
      - "ray-vast-pypi/docs/**"
      - "ray-vast-pypi/mkdocs.yml"
      - "ray-vast-pypi/CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ray-vast-pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.7.7
      - run: mkdocs build --strict -d site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ray-vast-pypi/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
