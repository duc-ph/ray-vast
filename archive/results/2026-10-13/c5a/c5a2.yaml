cluster_name: c5a-c7b4
max_workers: 1
idle_timeout_minutes: 5
provider:
  region: us-west-2
  image: rayproject/ray:2.59.0-py311-cpu
  max_dollars_per_hour: 1.0
  candidate_factor: 2
auth: {ssh_user: ray}
head_node_type: head
available_node_types:
  head:
    resources: {CPU: 0}
    node_config: {}
    max_workers: 0
  w1:
    resources: {CPU: 4, GPU: 1}
    min_workers: 1
    max_workers: 1
    node_config:
      disk_gb: 30
      offer_query:
        gpu_ram: {gte: 8000}
        dph_total: {lte: 0.30}
        inet_down: {gte: 500}
