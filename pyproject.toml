[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ray-vast"
dynamic = ["version"]
description = "A Ray autoscaler node provider for vast.ai workers with an AWS EC2 head."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Duc Pham", email = "thiel.pham@gmail.com" }]
dependencies = ["ray[default]>=2.59", "boto3", "cryptography>=42", "pyyaml", "requests"]

[project.urls]
Documentation = "https://duc-ph.github.io/ray-vast/"
Source = "https://github.com/duc-ph/ray-vast"
Changelog = "https://duc-ph.github.io/ray-vast/reference/changelog/"
Issues = "https://github.com/duc-ph/ray-vast/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-timeout", "pytest-xdist", "moto[server]", "responses", "freezegun", "build", "hatchling", "twine", "awscli"]

[project.scripts]
ray-vast = "ray_vast.cli:main"

[tool.hatch.version]
path = "src/ray_vast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_vast"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: starts processes, Docker containers or a local Ray cluster, or waits on real timers; no cost (skipped by default)",
    "live: uses real AWS or vast.ai and can cost money (skipped by default; tests/live)",
]
addopts = "-m 'not slow and not live'"
# A hung test (for example a `down` wait loop) fails after this many seconds instead of stopping the run.
timeout = 300

[tool.ruff]
line-length = 120
src = ["src", "tests"]
