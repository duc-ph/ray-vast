# The cluster of the AWS tests: the head only. No worker type can rent:
# `impossible` matches no offer, and `poor` has a budget below every offer. Custom resources let a test ask for one type.
cluster_name: rvtest-aws
idle_timeout_minutes: 5
provider:
  image: rayproject/ray:2.59.0-py311-gpu   # has an ENTRYPOINT (/opt/nvidia/nvidia_entrypoint.sh): the image check of `up` must survive it
  max_dollars_per_hour: 0.001
head_node_type: head
available_node_types:
  head: {resources: {CPU: 0}, node_config: {region: us-west-2}}
  impossible:
    resources: {CPU: 4, GPU: 1, impossible: 1}
    min_workers: 0
    max_workers: 1
    node_config: {offer_query: {gpu_ram: {gte: 900000}}}
  poor:
    resources: {CPU: 4, GPU: 1, poor: 1}
    min_workers: 0
    max_workers: 1
    node_config: {offer_query: {gpu_ram: {gte: 8000}}}
