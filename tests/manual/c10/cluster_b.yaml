# C10 phase B (docs/test-plan.md, "Cycle C10"): the C9 Data re-runs without C9_DATA_CPU and the RLlib functional tests
# R1-R3. The C9 layout: 2 workers of type `gpu` (1 GPU each), and the `gpu2` type (2 GPUs on one host) for R2 only.
cluster_name: rvtest-c10b
max_workers: 3
idle_timeout_minutes: 10
provider:
  image: rayproject/ray:2.59.0-py311-gpu
  # Peak: 4 `gpu` candidates + 2 `gpu2` candidates, about $2/h (C9 offers). Steady state: 2 workers, about $0.35/h.
  max_dollars_per_hour: 2.5
  candidate_factor: 2
auth: {ssh_user: ray}
head_node_type: head
available_node_types:
  head: {resources: {CPU: 0}, node_config: {region: us-west-2}, max_workers: 0}
  gpu:
    resources: {CPU: 4, GPU: 1}
    min_workers: 2
    max_workers: 2
    node_config: {disk_gb: 60, offer_query: {gpu_ram: {gte: 8000, lt: 70000}, compute_cap: {gte: 600, lt: 900}, inet_down: {gte: 500}, inet_up: {gte: 500}}}  # test-only speed floor (Mb/s)
  gpu2:
    resources: {CPU: 4, GPU: 2}
    min_workers: 0
    max_workers: 1
    node_config: {disk_gb: 60, offer_query: {gpu_ram: {gte: 8000, lt: 70000}, compute_cap: {gte: 600, lt: 900}, inet_down: {gte: 500}, inet_up: {gte: 500}}}  # test-only speed floor (Mb/s)
