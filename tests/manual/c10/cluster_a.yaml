# C10 phase A (docs/test-plan.md, "Cycle C10"): the many/tuned pairs on ONE big worker. max_workers 1: the autoscaler cannot
# add a second node for a pending demand, so every process of a test lands on the one node under test.
cluster_name: rvtest-c10a
max_workers: 1
idle_timeout_minutes: 30
provider:
  region: us-west-2
  image: rayproject/ray:2.59.0-py311-gpu   # torch for Train and RLlib comes from runtime_env pip (as in C9)
  image_size_gb: 20
  # Peak: 2 `big` candidates (k = 2): $0.337 + $0.671 = $1.01/h for about a minute. Steady state: 1 worker.
  max_dollars_per_hour: 1.0
  candidate_factor: 2
  key_name: ray-vast-devbox
  key_file: ~/ray-vast-devbox.pem
auth: {ssh_user: ray}
head_node_type: head
available_node_types:
  head: {resources: {CPU: 0}, node_config: {}, max_workers: 0}
  # A big host: CPU 32 makes ray-vast add cpu_cores_effective >= 32 to the offer query. Ray gets all real cores (the bootstrap
  # counts them), so the node can have 32 to 128 Ray CPUs. 1 cheap GPU: most vast hosts with many cores are GPU hosts.
  # Phase A uses no GPU (Train and RLlib run on CPU), so there is no compute_cap or gpu_ram filter. 2026-10-16T07:05Z: with
  # compute_cap 600-899 and dph <= 0.45 there were 0 offers; without them 16 offers on 16 machines with >= 32 cores, the
  # cheapest RTX 5060 Ti (32 cores) $0.337/h and 2x RTX 5070 Ti (64 cores) $0.671/h. The pids limit is only known after
  # the rental: run_c10.py reads it first (c10_probe.py).
  # 2026-10-16T07:27Z (live run): the host retry rented m33638 twice (pids.max 7680, the provider does not block a destroyed
  # host). Test change: the node type now rents only the 2 hosts that had pids.max 1280 in C9 (m3969 Tesla P100, 24 real
  # cores; m32816 RTX 3060, 48 real cores). CPU 4 is what their offers guarantee (cpu_cores_effective 6); Ray gets all
  # real cores.
  big:
    resources: {CPU: 4, GPU: 1}
    min_workers: 1
    max_workers: 1
    node_config: {disk_gb: 60, offer_query: {machine_id: {in: [3969, 32816]}, inet_down: {gte: 500}, inet_up: {gte: 500}}}  # test-only speed floor (Mb/s)
