# C5 (docs/test-plan.md): join and task. 1 slot, k = 2.
cluster_name: rvtest-c5
max_workers: 1
idle_timeout_minutes: 60
provider:
  image: rayproject/ray:2.59.0-py311-cpu
  max_dollars_per_hour: 1.0
auth: {ssh_user: ray}
head_node_type: head
available_node_types:
  head: {resources: {CPU: 0}, node_config: {region: us-west-2}, max_workers: 0}
  w:
    resources: {CPU: 4, GPU: 1}      # offers.py found no CPU-only offer (num_gpus = 0) on 2026-10-14
    min_workers: 1
    max_workers: 1
    node_config: {disk_gb: 30, offer_query: {inet_down: {gte: 500}, inet_up: {gte: 500}}}  # test-only speed floor (Mb/s)
