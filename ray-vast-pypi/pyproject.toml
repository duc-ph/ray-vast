[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ray-vast"
version = "0.1.0.dev0"
description = "A Ray autoscaler node provider for vast.ai workers with an AWS EC2 head."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Duc Pham", email = "thiel.pham@gmail.com" }]
dependencies = ["ray[default]>=2.59", "boto3", "cryptography", "pyyaml", "requests"]

[project.optional-dependencies]
test = ["pytest", "moto", "responses", "freezegun", "build", "hatchling"]

[project.scripts]
ray-vast = "ray_vast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_vast"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: uses real AWS or vast.ai (skipped by default)",
    "slow: takes more than 30 s",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
