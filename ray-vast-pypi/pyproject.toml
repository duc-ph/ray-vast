[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ray-vast"
version = "0.1.0.dev0"
description = "A Ray autoscaler node provider for vast.ai workers with an AWS EC2 head."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Duc Pham", email = "thiel.pham@gmail.com" }]
dependencies = ["ray[default]>=2.59", "boto3", "cryptography>=42", "pyyaml", "requests"]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout", "moto[server]", "responses", "freezegun", "build", "hatchling"]

[project.scripts]
ray-vast = "ray_vast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_vast"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: uses real AWS or vast.ai (skipped by default)",
    "slow: starts processes, containers, TLS servers or wheel builds, or waits on real timers (skipped by default)",
    "local_e2e: runs a Ray head and workers in Docker on the dev box (step 11; skipped by default)",
]
addopts = "-m 'not slow and not live and not local_e2e'"
# A hung test (for example a `down` wait loop) fails after this many seconds instead of stopping the run.
timeout = 300

[tool.ruff]
line-length = 120
src = ["src", "tests"]
